name: Renovate

permissions: read-all

env:
  RENOVATE_VERSION: 42.81.5-full
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate

on:
  schedule:
    # Run every 1 day at 8:19am UTC+0
    # avoids runners congestion
    - cron: '19 8 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      max_parallel: ${{ steps.set-matrix.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.x'
      - run: pip install requests pyjwt cryptography
      - name: Get GitHub App Token
        uses: actions/create-github-app-token@v2.2.1
        id: generate_token
        with:
          app-id: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          private-key: ${{ secrets.GOTHUB_PRIVATE_KEY }}

      - name: Get Bot User ID
        id: get_bot_user_id
        run: echo "BOT_USER_ID=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Generate Matrix
        id: set-matrix
        env:
          GITHUB_APP_ID: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GOTHUB_PRIVATE_KEY }}
          CODEBERG_BOT_USERNAME: ${{ secrets.CODEBERG_BOT_USERNAME || vars.CODEBERG_BOT_USERNAME }}
          GITHUB_INSTALLATION_WHITELIST: ${{ secrets.GOTHUB_INSTALLATION_WHITELIST || vars.GOTHUB_INSTALLATION_WHITELIST }}
          RENOVATE_BOT_USER_ID: ${{ steps.get_bot_user_id.outputs.BOT_USER_ID }}
          RENOVATE_APP_SLUG: ${{ steps.generate_token.outputs.app-slug }}
          RENOVATE_HASH_ALL_NAMESPACES: ${{ secrets.RENOVATE_HASH_ALL_NAMESPACES || vars.RENOVATE_HASH_ALL_NAMESPACES }}
          MATRIX_MAX_PARALLEL: ${{ secrets.MATRIX_MAX_PARALLEL || vars.MATRIX_MAX_PARALLEL || 5 }}
        run: python .github/scripts/get_installations.py

      - name: Cache Renovate Docker Image
        id: cache-renovate-image
        uses: actions/cache@v5.0.3
        with:
          path: renovate-image.tar.zst
          key: renovate-image-${{ env.RENOVATE_VERSION }}
          lookup-only: true

      - name: Free Disk Space (Discover)
        if: steps.cache-renovate-image.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Pull and Save Renovate Image
        if: steps.cache-renovate-image.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.RENOVATE_IMAGE }}:${{ env.RENOVATE_VERSION }}
          docker save ${{ env.RENOVATE_IMAGE }}:${{ env.RENOVATE_VERSION }} | zstd -T0 > renovate-image.tar.zst

  renovate:
    needs: discover
    name: Renovate (${{ matrix.platform }} - ${{ matrix.hashed_owner }})
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-${{ matrix.platform }}-${{ matrix.hashed_owner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.discover.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Free Disk Space (Renovate)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Restore Renovate Docker Image
        id: restore-renovate-image
        uses: actions/cache@v5.0.3
        with:
          path: renovate-image.tar.zst
          key: renovate-image-${{ env.RENOVATE_VERSION }}

      - name: Load Renovate Docker Image
        if: steps.restore-renovate-image.outputs.cache-hit == 'true'
        run: zstd -dc -T0 renovate-image.tar.zst | docker load

      - name: Cache Renovate
        uses: actions/cache@v5.0.3
        with:
          path: /tmp/renovate
          key: renovate-${{ matrix.platform }}-${{ matrix.hashed_owner }}-${{ github.run_id }}
          restore-keys: |
            renovate-${{ matrix.platform }}-${{ matrix.hashed_owner }}-

      - name: Fix Cache Permissions
        run: |
          sudo mkdir -p /tmp/renovate
          sudo chown -R 12021:0 /tmp/renovate

      - name: Mask Owner
        if: matrix.platform == 'github'
        run: echo "::add-mask::${{ matrix.owner }}"

      - name: Get GitHub App Token
        if: matrix.platform == 'github'
        uses: actions/create-github-app-token@v2.2.1
        id: generate_token
        with:
          app-id: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          private-key: ${{ secrets.GOTHUB_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      - name: Self-hosted Renovate (GitHub)
        if: matrix.platform == 'github'
        uses: renovatebot/github-action@v46.0.2
        with:
          configurationFile: renovate-config.js
          token: ${{ steps.generate_token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_PLATFORM: ${{ matrix.platform }}
          RENOVATE_ENDPOINT: ${{ matrix.endpoint }}
          RENOVATE_USERNAME: ${{ matrix.renovate_username }}
          RENOVATE_GIT_AUTHOR: ${{ matrix.git_author }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ secrets.RENOVATE_AUTODISCOVER_FILTER || vars.RENOVATE_AUTODISCOVER_FILTER }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || vars.LOG_LEVEL || 'fatal' }} # Defaults to max level to prevent info leaks on action log

      - name: Self-hosted Renovate (Codeberg)
        if: matrix.platform == 'forgejo'
        uses: renovatebot/github-action@v46.0.2
        with:
          configurationFile: renovate-config.js
          token: ${{ secrets.CODEBERG_TOKEN }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_PLATFORM: ${{ matrix.platform }}
          RENOVATE_ENDPOINT: ${{ matrix.endpoint }}
          RENOVATE_USERNAME: ${{ matrix.renovate_username }}
          RENOVATE_GIT_AUTHOR: ${{ matrix.git_author }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ secrets.RENOVATE_AUTODISCOVER_FILTER || vars.RENOVATE_AUTODISCOVER_FILTER }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || vars.LOG_LEVEL || 'fatal' }} # Defaults to max level to prevent info leaks on action log

      - name: Fix Cache Permissions for Save
        if: always()
        run: |
          sudo chown -R $USER /tmp/renovate
