name: Renovate

permissions: read-all

on:
  schedule:
    # Run every 1 hours
    - cron: '0 * * * 1'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      max_parallel: ${{ steps.set-matrix.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests pyjwt cryptography
      - name: Get GitHub App Token
        uses: actions/create-github-app-token@v1
        id: generate_token
        with:
          app-id: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          private-key: ${{ secrets.GOTHUB_PRIVATE_KEY }}

      - name: Get Bot User ID
        id: get_bot_user_id
        run: echo "BOT_USER_ID=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Generate Matrix
        id: set-matrix
        env:
          GITHUB_APP_ID: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GOTHUB_PRIVATE_KEY }}
          CODEBERG_BOT_USERNAME: ${{ secrets.CODEBERG_BOT_USERNAME || vars.CODEBERG_BOT_USERNAME }}
          GITHUB_INSTALLATION_WHITELIST: ${{ secrets.GOTHUB_INSTALLATION_WHITELIST || vars.GOTHUB_INSTALLATION_WHITELIST }}
          RENOVATE_BOT_USER_ID: ${{ steps.get_bot_user_id.outputs.BOT_USER_ID }}
          RENOVATE_APP_SLUG: ${{ steps.generate_token.outputs.app-slug }}
          RENOVATE_HASH_ALL_NAMESPACES: ${{ secrets.RENOVATE_HASH_ALL_NAMESPACES || vars.RENOVATE_HASH_ALL_NAMESPACES }}
          MATRIX_MAX_PARALLEL: ${{ secrets.MATRIX_MAX_PARALLEL || vars.MATRIX_MAX_PARALLEL || 5 }}
        run: python .github/scripts/get_installations.py

  renovate:
    needs: discover
    name: Renovate (${{ matrix.platform }} - ${{ matrix.owner }})
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-${{ matrix.platform }}-${{ matrix.owner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.discover.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Cache Renovate
        uses: actions/cache@v5.0.1
        with:
          path: /tmp/renovate
          key: renovate-${{ matrix.platform }}-${{ matrix.owner }}-${{ github.run_id }}
          restore-keys: |
            renovate-${{ matrix.platform }}-${{ matrix.owner }}-

      - name: Fix Cache Permissions
        run: |
          sudo mkdir -p /tmp/renovate
          sudo chown -R 12021:0 /tmp/renovate

      - name: Make entrypoint executable
        run: chmod +x .github/renovate-entrypoint.sh

      - name: Get GitHub App Token
        if: matrix.platform == 'github'
        uses: actions/create-github-app-token@v1
        id: generate_token
        with:
          app-id: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          private-key: ${{ secrets.GOTHUB_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      - name: Verify GitHub Token
        if: matrix.platform == 'github'
        run: |
          if [ -z "${{ steps.generate_token.outputs.token }}" ]; then
            echo "Error: GitHub token is empty."
            exit 1
          else
            echo "GitHub token is present."
          fi

      - name: Self-hosted Renovate (GitHub)
        if: matrix.platform == 'github'
        uses: renovatebot/github-action@v44.2.4
        with:
          configurationFile: renovate-config.js
          token: ${{ steps.generate_token.outputs.token }}
          renovate-version: 42.80.2-full
        env:
          RENOVATE_PLATFORM: ${{ matrix.platform }}
          RENOVATE_ENDPOINT: ${{ matrix.endpoint }}
          RENOVATE_USERNAME: ${{ matrix.renovate_username }}
          RENOVATE_GIT_AUTHOR: ${{ matrix.git_author }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ secrets.RENOVATE_AUTODISCOVER_FILTER || vars.RENOVATE_AUTODISCOVER_FILTER }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || vars.LOG_LEVEL || 'fatal' }} # Defaults to max level to prevent info leaks on action log

      - name: Verify Codeberg Token
        if: matrix.platform == 'forgejo'
        run: |
          if [ -z "${{ secrets.CODEBERG_TOKEN }}" ]; then
            echo "Error: Codeberg token is empty."
            exit 1
          else
            echo "Codeberg token is present."
          fi

      - name: Self-hosted Renovate (Codeberg)
        if: matrix.platform == 'forgejo'
        uses: renovatebot/github-action@v44.2.4
        with:
          configurationFile: renovate-config.js
          token: ${{ secrets.CODEBERG_TOKEN }}
          renovate-version: 42.80.2-full
        env:
          RENOVATE_PLATFORM: ${{ matrix.platform }}
          RENOVATE_ENDPOINT: ${{ matrix.endpoint }}
          RENOVATE_USERNAME: ${{ matrix.renovate_username }}
          RENOVATE_GIT_AUTHOR: ${{ matrix.git_author }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ secrets.RENOVATE_AUTODISCOVER_FILTER || vars.RENOVATE_AUTODISCOVER_FILTER }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || vars.LOG_LEVEL || 'fatal' }} # Defaults to max level to prevent info leaks on action log

      - name: Fix Cache Permissions for Save
        if: always()
        run: |
          sudo chown -R $USER /tmp/renovate

