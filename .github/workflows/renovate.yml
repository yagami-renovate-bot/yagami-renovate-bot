name: Renovate

permissions: read-all

on:
  schedule:
    # Run every 1 hours
    - cron: '0 * * * 1'
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate (${{ matrix.platform }})
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: github
            endpoint: '' # Default GitHub endpoint
            renovate_username: ${{ vars.RENOVATE_USERNAME }}
            git_author: '${{ vars.RENOVATE_USERNAME }}[bot] <${{ vars.RENOVATE_APP_ID }}+${{ vars.RENOVATE_USERNAME }}[bot]@users.noreply.github.com>'
          - platform: forgejo
            endpoint: https://codeberg.org/api/v1
            renovate_username: ${{ vars.CODEBERG_BOT_USERNAME }}
            git_author: '${{ vars.CODEBERG_BOT_USERNAME }} <${{ vars.CODEBERG_BOT_USERNAME }}@noreply.codeberg.org>'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Cache Renovate
        uses: actions/cache@v5.0.1
        with:
          path: /tmp/renovate
          key: renovate-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            renovate-${{ matrix.platform }}-

      - name: Fix Cache Permissions
        run: |
          sudo mkdir -p /tmp/renovate
          sudo chown -R 12021:0 /tmp/renovate

      # Run Renovate (GitHub)
      - name: Self-hosted Renovate (GitHub)
        if: matrix.platform == 'github'
        uses: renovatebot/github-action@v44.2.4
        with:
          configurationFile: renovate-config.js
          # Use a dummy token to satisfy the action's requirement.
          # We unset RENOVATE_TOKEN in env to ensure the App ID/Key are used for discovery.
          token: 'dummy'
          renovate-version: 42.80.2-full
        env:
          # Unset the token passed by the action to allow App-based discovery
          RENOVATE_TOKEN: ''
          # GitHub App Authentication (Enables multi-installation discovery)
          RENOVATE_APP_ID: ${{ vars.RENOVATE_APP_ID }}
          RENOVATE_PRIVATE_KEY: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          # Pass matrix values
          RENOVATE_PLATFORM: ${{ matrix.platform }}
          RENOVATE_ENDPOINT: ${{ matrix.endpoint }}
          RENOVATE_USERNAME: ${{ matrix.renovate_username }}
          RENOVATE_GIT_AUTHOR: ${{ matrix.git_author }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ vars.RENOVATE_AUTODISCOVER_FILTER }}
          LOG_LEVEL: debug

      # Run Renovate (Forgejo/Codeberg)
      - name: Self-hosted Renovate (Forgejo)
        if: matrix.platform == 'forgejo'
        uses: renovatebot/github-action@v44.2.4
        with:
          configurationFile: renovate-config.js
          token: ${{ secrets.CODEBERG_TOKEN }}
          renovate-version: 42.80.2-full
        env:
          # Pass matrix values (No GitHub App env vars here to avoid auth conflicts)
          RENOVATE_PLATFORM: ${{ matrix.platform }}
          RENOVATE_ENDPOINT: ${{ matrix.endpoint }}
          RENOVATE_USERNAME: ${{ matrix.renovate_username }}
          RENOVATE_GIT_AUTHOR: ${{ matrix.git_author }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ vars.RENOVATE_AUTODISCOVER_FILTER }}
          LOG_LEVEL: debug

      - name: Fix Cache Permissions for Save
        if: always()
        run: |
          sudo chown -R $USER /tmp/renovate
