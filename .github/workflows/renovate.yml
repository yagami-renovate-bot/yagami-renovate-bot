name: Renovate

permissions: read-all

on:
  schedule:
    # Run every 1 hours
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate (${{ matrix.platform }})
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: github
            endpoint: '' # Default GitHub endpoint
            renovate_username: ${{ vars.RENOVATE_USERNAME }}
            git_author: '${{ vars.RENOVATE_USERNAME }}[bot] <${{ vars.RENOVATE_APP_ID }}+${{ vars.RENOVATE_USERNAME }}[bot]@users.noreply.github.com>'
          - platform: codeberg
            endpoint: https://codeberg.org/api/v1
            renovate_username: ${{ vars.CODEBERG_BOT_USERNAME }}
            git_author: '${{ vars.CODEBERG_BOT_USERNAME }} <${{ vars.CODEBERG_BOT_USERNAME }}@noreply.codeberg.org>'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Cache Renovate
        uses: actions/cache@v5.0.1
        with:
          path: /tmp/renovate
          key: renovate-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            renovate-${{ matrix.platform }}-

      - name: Fix Cache Permissions
        run: |
          sudo mkdir -p /tmp/renovate
          sudo chown -R 12021:0 /tmp/renovate

      # GitHub App Token Generation (Only for GitHub platform)
      - name: Get GitHub App Token
        if: matrix.platform == 'github'
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}

      # Run Renovate
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v44.2.4
        with:
          configurationFile: renovate-config.js
          # Token selection logic:
          # - GitHub: Use the generated App token
          # - Codeberg: Use the stored Bot Personal Access Token
          token: ${{ matrix.platform == 'github' && steps.get_token.outputs.token || secrets.CODEBERG_TOKEN }}
          renovate-version: 42.80.2-full # Pinning a recent version is recommended
        env:
          # Pass matrix values to the configuration file via env vars
          RENOVATE_PLATFORM: ${{ matrix.platform }}
          RENOVATE_ENDPOINT: ${{ matrix.endpoint }}
          RENOVATE_USERNAME: ${{ matrix.renovate_username }}
          RENOVATE_GIT_AUTHOR: ${{ matrix.git_author }}
          # Optional: Filter which repos to discover (useful for testing or limiting scope)
          # You can set this secret/var per environment or globally
          RENOVATE_AUTODISCOVER_FILTER: ${{ vars.RENOVATE_AUTODISCOVER_FILTER }}
          LOG_LEVEL: info

      - name: Fix Cache Permissions for Save
        if: always()
        run: |
          sudo chown -R $USER /tmp/renovate
