name: Renovate

permissions: read-all

env:
  RENOVATE_VERSION: 42.81.5-full@sha256:d8a8d356115205613eeb60122ca658404df02f45cbf5cdc895efe25bae4b0265
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate

on:
  schedule:
    # Run every 1 day at 8:19am UTC+0
    # avoids runners congestion
    - cron: '19 8 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      max_parallel: ${{ steps.set-matrix.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
      - run: pip install requests pyjwt cryptography
      - name: Get GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate_token
        with:
          app-id: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          private-key: ${{ secrets.GOTHUB_PRIVATE_KEY }}

      - name: Get Bot User ID
        id: get_bot_user_id
        run: echo "BOT_USER_ID=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Generate Matrix
        id: set-matrix
        env:
          GITHUB_APP_ID: ${{ secrets.GOTHUB_APP_ID || vars.GOTHUB_APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GOTHUB_PRIVATE_KEY }}
          CODEBERG_BOT_USERNAME: ${{ secrets.CODEBERG_BOT_USERNAME || vars.CODEBERG_BOT_USERNAME }}
          GITHUB_INSTALLATION_WHITELIST: ${{ secrets.GOTHUB_INSTALLATION_WHITELIST || vars.GOTHUB_INSTALLATION_WHITELIST }}
          RENOVATE_BOT_USER_ID: ${{ steps.get_bot_user_id.outputs.BOT_USER_ID }}
          RENOVATE_APP_SLUG: ${{ steps.generate_token.outputs.app-slug }}
          RENOVATE_HASH_ALL_NAMESPACES: ${{ secrets.RENOVATE_HASH_ALL_NAMESPACES || vars.RENOVATE_HASH_ALL_NAMESPACES }}
          MATRIX_MAX_PARALLEL: ${{ secrets.MATRIX_MAX_PARALLEL || vars.MATRIX_MAX_PARALLEL || 5 }}
        run: python .github/scripts/get_installations.py

      - name: Cache Renovate Docker Image
        id: cache-renovate-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: renovate-image.tar.zst
          key: renovate-image-${{ env.RENOVATE_VERSION }}
          lookup-only: true

      - name: Free Disk Space (Discover)
        if: steps.cache-renovate-image.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Pull and Save Renovate Image
        if: steps.cache-renovate-image.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.RENOVATE_IMAGE }}:${{ env.RENOVATE_VERSION }}
          docker save ${{ env.RENOVATE_IMAGE }}:${{ env.RENOVATE_VERSION }} | zstd -T0 > renovate-image.tar.zst

  renovate:
    needs: discover
    name: Renovate (${{ matrix.platform }} - ${{ matrix.hashed_owner }})
    concurrency:
      group: renovate-${{ matrix.platform }}-${{ matrix.hashed_owner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.discover.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/renovate-worker.yml
    with:
      platform: ${{ matrix.platform }}
      hashed_owner: ${{ matrix.hashed_owner }}
      endpoint: ${{ matrix.endpoint }}
      renovate_username: ${{ matrix.renovate_username }}
      git_author: ${{ matrix.git_author }}
    secrets:
      owner: ${{ matrix.owner }}
      GOTHUB_APP_ID: ${{ secrets.GOTHUB_APP_ID }}
      GOTHUB_PRIVATE_KEY: ${{ secrets.GOTHUB_PRIVATE_KEY }}
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      RENOVATE_AUTODISCOVER_FILTER: ${{ secrets.RENOVATE_AUTODISCOVER_FILTER }}
      RENOVATE_AUTODISCOVER_FILTER_GITHUB: ${{ secrets.RENOVATE_AUTODISCOVER_FILTER_GITHUB }}
      RENOVATE_AUTODISCOVER_FILTER_CODEBERG: ${{ secrets.RENOVATE_AUTODISCOVER_FILTER_CODEBERG }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
